name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Run unit tests
      run: |
        python -m unittest discover -s .

    - name: Run Preflight Security Check
      run: |
        # Run the PREFLIGHT superplay to ensure no malicious writes were sneaked into Plays
        python plays/preflight/preflight.py --format human
